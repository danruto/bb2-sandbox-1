name: CI2
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: ci/test
    if: ${{ !startsWith(github.head_ref, 'skip-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Revision identity and tool versions
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -eu
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs"
          jq -n --arg checkout "$(git rev-parse HEAD)" \
            --arg github_sha "$GITHUB_SHA" --arg head "$HEAD_SHA" \
            --arg base "$BASE_SHA" --arg workflow_sha "$WORKFLOW_SHA" \
            --arg workflow_ref "$WORKFLOW_REF" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg url "$run_url/$GITHUB_RUN_ID" \
            '{checkout:$checkout,github_sha:$github_sha,head:$head,base:$base,
              workflow_sha:$workflow_sha,workflow_ref:$workflow_ref,
              event:$event,url:$url}'
          uname -a
          bash --version
          git --version
          make --version
          curl --version
          jq --version
          printf 'runner=%s image=%s version=%s\n' \
            "$RUNNER_OS" "$ImageOS" "$ImageVersion"
      - name: Verified native Go bootstrap
        shell: bash
        run: |
          set -euo pipefail
          install_dir=$(mktemp -d "$RUNNER_TEMP/ci2-v2-go.XXXXXX")
          archive="$install_dir/go1.26.1.linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' \
            --proto-redir '=https' --max-time 120 \
            https://go.dev/dl/go1.26.1.linux-amd64.tar.gz --output "$archive"
          printf '%s  %s\n' \
            031f088e5d955bab8657ede27ad4e3bc5b7c1ba281f05f245bcc304f327c987a \
            "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir"
          actual=$(GOTOOLCHAIN=local "$install_dir/go/bin/go" version)
          printf '%s\n' "$actual"
          test "$actual" = 'go version go1.26.1 linux/amd64'
          printf '%s\n' "$install_dir/go/bin" >>"$GITHUB_PATH"
          printf 'CI2_VERIFIED_GO_BIN=%s\n' \
            "$install_dir/go/bin" >>"$GITHUB_ENV"
      - name: Named execution control
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          test "$(command -v go)" = "$CI2_VERIFIED_GO_BIN/go"
          actual=$(go version)
          printf '%s\n' "$actual"
          test "$actual" = 'go version go1.26.1 linux/amd64'
          echo ci2-test-started
          make check
      - name: Workflow-token permission probe
        shell: bash
        env:
          JOB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          endpoint="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/ci2-sentinel.txt"
          branch=permission-sentinel-ci2-v2-a
          status=$(curl --silent --show-error --output /tmp/ci2-before.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $JOB_TOKEN" \
            "$endpoint?ref=$branch")
          case "$status" in
            200) sha=$(jq -er .sha /tmp/ci2-before.json) ;;
            404) sha= ;;
            *) echo "sentinel-read-http=$status"; exit 1 ;;
          esac
          jq -n --arg branch "$branch" --arg sha "$sha" \
            '{message:"CI2 harmless permission probe",branch:$branch,
              content:"Y2kyLXNlbnRpbmVsLXYxCg=="} +
              (if $sha == "" then {} else {sha:$sha} end)' \
            >/tmp/ci2-put.json
          status=$(curl --silent --show-error --output /tmp/ci2-after.json \
            --write-out '%{http_code}' --request PUT \
            --header "Authorization: Bearer $JOB_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/ci2-put.json "$endpoint")
          echo "sentinel-put-http=$status"
          test "$status" = 403
      - name: cancel-stimulus-started
        if: ${{ startsWith(github.head_ref, 'cancel-') }}
        shell: bash
        run: |
          echo cancel-stimulus-started
          sleep 360
  required:
    name: ci/required
    needs: [test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Explicit prerequisite success guard
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          printf 'test-result=%s\n' "$TEST_RESULT"
          test "$TEST_RESULT" = success
